    <text x="330" y="363">46</text>
    <text x="425" y="363">15</text>
    <text x="520" y="363">24</text>
    <text x="615" y="363">36</text>
    <text x="715" y="363">14</text>
    <text x="815" y="363">11</text>
    <text x="925" y="363">9</text>
    <text x="1025" y="363">63</text>

    <!-- Row 6: Dunkin' Donuts -->
    <text x="65" y="397">Dunkin' Donuts</text>
    <text x="330" y="397">46</text>
    <text x="425" y="397">15</text>
    <text x="520" y="397">27</text>
    <text x="615" y="397">33</text>
    <text x="715" y="397">20</text>
    <text x="815" y="397">14</text>
    <text x="925" y="397">6</text>

    <text x="520" y="609" font-weight="700" fill="#0f172a">3</text>
    <text x="615" y="609" font-weight="700" fill="#0f172a">2</text>
    <text x="715" y="609" font-weight="700" fill="#0f172a">2</text>
    <text x="815" y="609" font-weight="700" fill="#0f172a">2</text>

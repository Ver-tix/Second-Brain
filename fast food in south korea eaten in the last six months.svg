    <text x="0" y="26" font-size="15" font-weight="500" fill="#64748b">— Sample of demographic profiles (%)</text>
  </g>

  <!-- Table Headers Background -->
  <rect x="50" y="125" width="1050" height="70" rx="8" fill="#1e293b" />

  <!-- Headers Text -->
  <g fill="#ffffff" font-weight="700" font-size="11.5" letter-spacing="0.02em">
    <!-- Row 1 header -->
    <text x="65" y="152">Brands</text>
    <text x="330" y="152">Male</text>
    <text x="425" y="152">18–24</text>
    <text x="520" y="152">25–34</text>
    <text x="615" y="152">Lower</text>
    <text x="715" y="152">Higher</text>
    <text x="815" y="152">Children</text>
    <text x="925" y="152">One Person</text>
    <text x="1025" y="152">Work</text>

    <!-- Row 2 header -->
    <text x="65" y="172" fill="#94a3b8" font-size="10.5" font-weight="500">(penetration order)</text>
    <text x="330" y="172" fill="#94a3b8" font-size="10.5" font-weight="500">(%)</text>
    <text x="425" y="172" fill="#94a3b8" font-size="10.5" font-weight="500">years (%)</text>
    <text x="520" y="172" fill="#94a3b8" font-size="10.5" font-weight="500">years (%)</text>
    <text x="615" y="172" fill="#94a3b8" font-size="10.5" font-weight="500">income (%)</text>
    <text x="715" y="172" fill="#94a3b8" font-size="10.5" font-weight="500">income (%)</text>
    <text x="815" y="172" fill="#94a3b8" font-size="10.5" font-weight="500">under 5 (%)</text>
    <text x="925" y="172" fill="#94a3b8" font-size="10.5" font-weight="500">hhold (%)</text>
    <text x="1025" y="172" fill="#94a3b8" font-size="10.5" font-weight="500">full-time (%)</text>

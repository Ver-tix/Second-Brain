    <text x="330" y="643" font-weight="700" fill="#0f172a">46</text>
    <text x="425" y="643" font-weight="700" fill="#0f172a">16</text>
    <text x="520" y="643" font-weight="700" fill="#0f172a">23</text>
    <text x="615" y="643" font-weight="700" fill="#0f172a">35</text>
    <text x="715" y="643" font-weight="700" fill="#0f172a">16</text>
    <text x="815" y="643" font-weight="700" fill="#0f172a">13</text>

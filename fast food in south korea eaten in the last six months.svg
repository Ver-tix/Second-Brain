    <text x="425" y="575" font-weight="700" fill="#0f172a">15</text>
    <text x="520" y="575" font-weight="700" fill="#0f172a">26</text>
    <text x="615" y="575" font-weight="700" fill="#0f172a">34</text>
    <text x="715" y="575" font-weight="700" fill="#0f172a">18</text>
    <text x="815" y="575" font-weight="700" fill="#0f172a">13</text>
    <text x="925" y="575" font-weight="700" fill="#0f172a">7</text>

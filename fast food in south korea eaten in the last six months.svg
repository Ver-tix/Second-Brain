    <text x="65" y="227" font-weight="700" fill="#0f172a">*Lotteria</text>
    <text x="330" y="227">47</text>
    <text x="425" y="227">16</text>
    <text x="520" y="227">25</text>
    <text x="615" y="227">37</text>
    <text x="715" y="227">16</text>
    <text x="815" y="227">13</text>
    <text x="925" y="227">8</text>
    <text x="1025" y="227">62</text>


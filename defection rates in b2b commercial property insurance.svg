<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background-color: #ffffff; font-family: sans-serif;">
  <!-- Título -->
  <text x="50" y="30" font-size="16" font-weight="bold">Figure 11.1: Defection rates in the B2B commercial property insurance category in the USA</text>

  <!-- Eixos -->
  <line x1="100" y1="320" x2="500" y2="320" stroke="black" stroke-width="2" />
  <line x1="100" y1="320" x2="100" y2="70" stroke="black" stroke-width="2" />

  <!-- Rótulos Y -->
  <text x="80" y="325" text-anchor="end" font-size="12">0</text>
  <text x="80" y="275" text-anchor="end" font-size="12">10</text>
  <text x="80" y="225" text-anchor="end" font-size="12">20</text>
  <text x="80" y="175" text-anchor="end" font-size="12">30</text>
  <text x="80" y="125" text-anchor="end" font-size="12">40</text>
  <text x="80" y="75" text-anchor="end" font-size="12">50</text>
  <text x="40" y="200" transform="rotate(-90 40,200)" font-weight="bold">% future defection potential</text>

  <!-- Rótulos X -->
  <text x="100" y="345" text-anchor="middle" font-size="12">0</text>
  <text x="200" y="345" text-anchor="middle" font-size="12">5</text>
  <text x="300" y="345" text-anchor="middle" font-size="12">10</text>
  <text x="400" y="345" text-anchor="middle" font-size="12">15</text>
  <text x="500" y="345" text-anchor="middle" font-size="12">20</text>
  <text x="300" y="370" font-weight="bold">% of customers</text>

  <!-- Linhas de Grade -->
  <line x1="100" y1="275" x2="500" y2="275" stroke="#ccc" />
  <line x1="100" y1="225" x2="500" y2="225" stroke="#ccc" />
  <line x1="100" y1="175" x2="500" y2="175" stroke="#ccc" />
  <line x1="100" y1="125" x2="500" y2="125" stroke="#ccc" />
  <line x1="100" y1="75" x2="500" y2="75" stroke="#ccc" />

  <!-- Linha de Tendência -->
  <line x1="150" y1="140" x2="450" y2="250" stroke="black" stroke-width="2" />
  <path d="M450 250 L440 240 L450 250 L440 260" stroke="black" stroke-width="2" fill="none" />

  <!-- Pontos (estimados baseados na imagem) -->
  <g fill="none" stroke="black">
    <circle cx="210" cy="180" r="4" />
    <circle cx="220" cy="190" r="4" />
    <circle cx="230" cy="200" r="4" />
    <circle cx="240" cy="140" r="4" />
    <circle cx="250" cy="195" r="4" />
    <circle cx="260" cy="210" r="4" />
    <circle cx="360" cy="235" r="4" />
    <circle cx="410" cy="220" r="4" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title -->
  <text x="50" y="55" font-size="21" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">
    FIGURA 7.1 Número de canais de TV assistidos por famílias norte-americanas, 2002
  </text>

  <!-- Legend -->
  <g transform="translate(320, 95)">
    <rect x="0" y="0" width="60" height="18" fill="#334155" rx="3" />
    <text x="75" y="14" font-size="15" font-weight="600" fill="#475569">Canais assistidos por semana</text>
  </g>

  <!-- ================= GRID LINES (Y-AXIS) ================= -->
  <!-- Y = 20 -->
  <line x1="100" y1="180" x2="940" y2="180" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="80" y="185" font-size="16" font-weight="700" fill="#334155" text-anchor="end">20</text>

  <!-- Y = 15 -->
  <line x1="100" y1="260" x2="940" y2="260" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="80" y="265" font-size="16" font-weight="700" fill="#334155" text-anchor="end">15</text>

  <!-- Y = 10 -->
  <line x1="100" y1="340" x2="940" y2="340" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="80" y="345" font-size="16" font-weight="700" fill="#334155" text-anchor="end">10</text>

  <!-- Y = 5 -->
  <line x1="100" y1="420" x2="940" y2="420" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="80" y="425" font-size="16" font-weight="700" fill="#334155" text-anchor="end">5</text>

  <!-- Y = 0 (Baseline) -->
  <line x1="100" y1="500" x2="940" y2="500" stroke="#475569" stroke-width="2" />
  <text x="80" y="505" font-size="16" font-weight="700" fill="#334155" text-anchor="end">0</text>


  <!-- ================= X-AXIS LABELS ================= -->
  <text x="100" y="535" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">0</text>
  <text x="180" y="535" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">20</text>
  <text x="260" y="535" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">40</text>
  <text x="340" y="535" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">60</text>
  <text x="420" y="535" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">80</text>
  <text x="500" y="535" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">100</text>
  <text x="720" y="540" font-size="18" font-weight="800" fill="#475569" text-anchor="middle">...</text>
  <text x="940" y="535" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">200</text>


  <!-- ================= DATA CURVE ================= -->
  <!-- Thick, smooth curve reflecting the exact shape of the data -->
  <path d="M 100 500 
           C 130 460, 150 410, 180 396
           S 210 395, 225 385
           C 240 360, 250 320, 260 305
           C 285 275, 310 265, 340 263
           C 370 261, 400 261, 420 260
           C 440 259, 450 250, 460 242
           C 470 234, 475 245, 485 254
           C 495 258, 500 258, 510 258
           C 600 258, 700 256, 800 252
           C 860 252, 910 254, 940 254" 
        fill="none" 
        stroke="#334155" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" />


  <!-- ================= AXIS TITLE & FOOTER ================= -->
  <!-- X-Axis Title -->
  <text x="520" y="585" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">
    Canais aos quais a família tem acesso
  </text>

  <!-- Footer / Source -->
  <text x="940" y="620" font-size="13" font-weight="500" fill="#64748b" text-anchor="end">
    Fonte: Virginia Beal, com dados da Nielsen.
  </text>
</svg>

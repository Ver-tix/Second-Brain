<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Diagrama com "lealdade à marca" à esquerda, ligado por setas a quatro benefícios: redução de custos de marketing, poder de barganha, atração de novos clientes (com dois subitens: reconhecimento de marca criado e tranquilidade para novos clientes) e resposta a ameaças competitivas. Cores adaptadas para fundo escuro.</desc>



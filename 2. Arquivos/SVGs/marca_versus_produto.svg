<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Diagrama circular mostrando o produto (escopo, atributos, qualidade, usos) no centro, envolvido por elementos da marca: associações organizacionais, personalidade da marca, símbolos, relacionamento marca-cliente, benefícios emocionais, benefícios de autoexpressão, imagem do usuário e país de origem.</desc>

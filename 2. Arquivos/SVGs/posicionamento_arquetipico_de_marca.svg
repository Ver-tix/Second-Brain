<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%" role="img">
<title>Posicionamento arquetípico da marca</title>
<desc>Diagrama circular com "posicionamento arquetípico da marca" no centro, alimentado por quatro entradas: alma da marca, substância da marca, análise da concorrência e análise do público-alvo, e uma saída: contando as histórias da marca. Cada rótulo tem um fundo sólido para garantir contraste em qualquer fundo de tela.</desc>

<style>
  .lbl-title { font: bold 20px sans-serif; fill: #f8fafc; }
  .lbl-center { font: bold 24px sans-serif; fill: #f8fafc; }
  .circle { fill: #1e293b; stroke: #94a3b8; stroke-width: 2; }
  .conn { stroke: #64748b; stroke-width: 2.5; fill: none; }
  .tagbg { fill: #0f172a; stroke: #475569; stroke-width: 1; }
</style>
<defs>
<marker id="arrowd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<circle cx="500" cy="440" r="240" class="circle"/>
<text class="lbl-center" x="500" y="410" text-anchor="middle">Posicionamento</text>
<text class="lbl-center" x="500" y="445" text-anchor="middle">arquetípico</text>
<text class="lbl-center" x="500" y="480" text-anchor="middle">da marca</text>

<path d="M230 110 L340 250" class="conn" marker-end="url(#arrowd)"/>
<rect x="60" y="40" width="270" height="46" rx="8" class="tagbg"/>
<text class="lbl-title" x="195" y="70" text-anchor="middle">Alma da marca</text>

<path d="M770 110 L660 250" class="conn" marker-end="url(#arrowd)"/>
<rect x="600" y="40" width="340" height="46" rx="8" class="tagbg"/>
<text class="lbl-title" x="770" y="70" text-anchor="middle">Substância da marca</text>

<path d="M210 780 L320 630" class="conn" marker-end="url(#arrowd)"/>
<rect x="30" y="785" width="390" height="46" rx="8" class="tagbg"/>
<text class="lbl-title" x="225" y="815" text-anchor="middle">Análise da concorrência</text>

<path d="M790 780 L680 630" class="conn" marker-end="url(#arrowd)"/>
<rect x="590" y="785" width="390" height="46" rx="8" class="tagbg"/>
<text class="lbl-title" x="785" y="815" text-anchor="middle">Análise do público-alvo</text>

<line x1="500" y1="680" x2="500" y2="820" class="conn" marker-end="url(#arrowd)"/>
<rect x="260" y="840" width="480" height="46" rx="8" class="tagbg"/>
<text class="lbl-title" x="500" y="870" text-anchor="middle">Contando as histórias da marca</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1990 1100" width="100%" height="100%" role="img">
<title>Os oito estágios do ser humano e os conflitos pessoais correlatos, segundo Erikson</title>
<desc>Grade 8x8 de Erikson mostrando os oito estágios de desenvolvimento psicossocial nas colunas e sua manifestação em cada faixa etária nas linhas, com a diagonal principal destacando a crise central de cada estágio e a linha V (adolescência) mostrando como a crise de identidade se relaciona com todos os outros estágios.</desc>

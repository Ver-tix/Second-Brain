<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%" style="background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop shadow for container cards -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
  </defs>

  <!-- ================= FIGURE 2.1 CARD ================= -->
  <g transform="translate(40, 40)">
    <!-- Card Background -->
    <rect x="0" y="0" width="920" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)" />

    <!-- Title Block -->
    <text x="40" y="45" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">Figure 2.1: Buying frequency distributions for a range of categories, countries</text>
    <text x="136" y="70" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">and brands</text>

    <!-- Grid & Axes Group -->
    <g transform="translate(40, 0)">
      <!-- Y-Axis Gridlines & Labels -->
      <!-- 100% -->
      <line x1="80" y1="130" x2="800" y2="130" stroke="#f1f5f9" stroke-width="1.5" />
      <text x="65" y="134" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">100</text>

      <!-- 80% -->
      <line x1="80" y1="180" x2="800" y2="180" stroke="#f1f5f9" stroke-width="1.5" />
      <text x="65" y="184" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">80</text>

      <!-- 60% -->
      <line x1="80" y1="230" x2="800" y2="230" stroke="#f1f5f9" stroke-width="1.5" />
      <text x="65" y="234" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">60</text>

      <!-- 40% -->
      <line x1="80" y1="280" x2="800" y2="280" stroke="#f1f5f9" stroke-width="1.5" />
      <text x="65" y="284" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">40</text>

      <!-- 20% -->
      <line x1="80" y1="330" x2="800" y2="330" stroke="#f1f5f9" stroke-width="1.5" />
      <text x="65" y="334" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">20</text>

      <!-- 0% Baseline -->
      <line x1="80" y1="380" x2="800" y2="380" stroke="#94a3b8" stroke-width="1.5" />
      <text x="65" y="384" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">0</text>

      <!-- X-Axis Labels (Ticks mapped at x: 80, 260, 440, 620, 800) -->
      <text x="80" y="405" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Zero</text>
      <text x="260" y="405" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">1–3</text>
      <text x="440" y="405" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">4–6</text>
      <text x="620" y="405" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">7–10</text>
      <text x="800" y="405" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">11+</text>

      <!-- X-Axis Title -->
      <text x="440" y="430" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Purchase frequency (number of times)</text>

      <!-- DATA LINES & MARKERS -->
      <!-- 1. Sorriso Super Refrescante Toothpaste, Brazil (Solid Gray) -->
      <polyline points="80,217.5 260,317.5 440,362.5 620,370 800,372.5" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <g fill="#64748b">
        <circle cx="80" cy="217.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="260" cy="317.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="440" cy="362.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="620" cy="370" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="800" cy="372.5" r="4" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- 2. San Miguel Pale Pilsen Beer, Philippines (Dotted Blue) -->
      <polyline points="80,182.5 260,352.5 440,357.5 620,365 800,367.5" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="2,5" stroke-linecap="round" stroke-linejoin="round" />
      <g fill="#0ea5e9">
        <circle cx="80" cy="182.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="260" cy="352.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="440" cy="357.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="620" cy="365" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="800" cy="367.5" r="4" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- 3. Cola Turka Soft Drink, Turkey (Solid Navy) -->
      <polyline points="80,165 260,367.5 440,372.5 620,372.5 800,372.5" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <g fill="#0f172a">
        <circle cx="80" cy="165" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="260" cy="367.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="440" cy="372.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="620" cy="372.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="800" cy="372.5" r="4" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- 4. Coca-Cola Light Soft Drink, Turkey (Dashed Red) -->
      <polyline points="80,192.5 260,355 440,360 620,370 800,372.5" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round" stroke-linejoin="round" />
      <g fill="#f43f5e">
        <circle cx="80" cy="192.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="260" cy="355" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="440" cy="360" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="620" cy="370" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="800" cy="372.5" r="4" stroke="#ffffff" stroke-width="1.5" />
      </g>
    </g>

    <!-- Legend (2x2 Grid Layout at the bottom) -->
    <g transform="translate(100, 465)">
      <!-- Col 1, Row 1: Sorriso -->
      <g transform="translate(0, 0)">
        <line x1="0" y1="8" x2="30" y2="8" stroke="#64748b" stroke-width="3.5" />
        <circle cx="15" cy="8" r="4.5" fill="#64748b" stroke="#ffffff" stroke-width="1" />
        <text x="42" y="12" font-size="13" font-weight="600" fill="#334155">Sorriso Super Refrescante Toothpaste, Brazil</text>
      </g>
      <!-- Col 2, Row 1: San Miguel -->
      <g transform="translate(390, 0)">
        <line x1="0" y1="8" x2="30" y2="8" stroke="#0ea5e9" stroke-width="3.5" stroke-dasharray="2,4" />
        <circle cx="15" cy="8" r="4.5" fill="#0ea5e9" stroke="#ffffff" stroke-width="1" />
        <text x="42" y="12" font-size="13" font-weight="600" fill="#334155">San Miguel Pale Pilsen Beer, Philippines</text>
      </g>
      <!-- Col 1, Row 2: Cola Turka -->
      <g transform="translate(0, 28)">
        <line x1="0" y1="8" x2="30" y2="8" stroke="#0f172a" stroke-width="3.5" />
        <circle cx="15" cy="8" r="4.5" fill="#0f172a" stroke="#ffffff" stroke-width="1" />
        <text x="42" y="12" font-size="13" font-weight="600" fill="#334155">Cola Turka Soft Drink, Turkey</text>
      </g>
      <!-- Col 2, Row 2: Coca-Cola Light -->
      <g transform="translate(390, 28)">
        <line x1="0" y1="8" x2="30" y2="8" stroke="#f43f5e" stroke-width="3.5" stroke-dasharray="6,4" />
        <circle cx="15" cy="8" r="4.5" fill="#f43f5e" stroke="#ffffff" stroke-width="1" />
        <text x="42" y="12" font-size="13" font-weight="600" fill="#334155">Coca-Cola Light Soft Drink, Turkey</text>
      </g>
    </g>
  </g>


  <!-- ================= FIGURE 2.2 CARD ================= -->
  <g transform="translate(40, 610)">
    <!-- Card Background -->
    <rect x="0" y="0" width="920" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)" />

    <!-- Title Block -->
    <text x="40" y="45" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">Figure 2.2: Buying frequency distributions for fuel brands in the UK (2012)</text>

    <!-- Grid & Axes Group -->
    <g transform="translate(40, 0)">
      <!-- Y-Axis Gridlines & Labels -->
      <!-- 100% -->
      <line x1="80" y1="130" x2="800" y2="130" stroke="#f1f5f9" stroke-width="1.5" />
      <text x="65" y="134" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">100</text>

      <!-- 80% -->
      <line x1="80" y1="180" x2="800" y2="180" stroke="#f1f5f9" stroke-width="1.5" />
      <text x="65" y="184" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">80</text>

      <!-- 60% -->
      <line x1="80" y1="230" x2="800" y2="230" stroke="#f1f5f9" stroke-width="1.5" />
      <text x="65" y="234" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">60</text>

      <!-- 40% -->
      <line x1="80" y1="280" x2="800" y2="280" stroke="#f1f5f9" stroke-width="1.5" />
      <text x="65" y="284" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">40</text>

      <!-- 20% -->
      <line x1="80" y1="330" x2="800" y2="330" stroke="#f1f5f9" stroke-width="1.5" />
      <text x="65" y="334" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">20</text>

      <!-- 0% Baseline -->
      <line x1="80" y1="380" x2="800" y2="380" stroke="#94a3b8" stroke-width="1.5" />
      <text x="65" y="384" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">0</text>

      <!-- X-Axis Labels (Ticks mapped at x: 80, 320, 560, 800) -->
      <text x="80" y="405" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Zero</text>
      <text x="320" y="405" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">1–3</text>
      <text x="560" y="405" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">4–6</text>
      <text x="800" y="405" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">7+</text>

      <!-- X-Axis Title -->
      <text x="440" y="430" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Purchase frequency (number of times)</text>

      <!-- DATA LINES & MARKERS -->
      <!-- 1. Tesco Fuel (Solid Dark Slate) -->
      <polyline points="80,202.5 320,325 560,357.5 800,370" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <g fill="#0f172a">
        <circle cx="80" cy="202.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="320" cy="325" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="560" cy="357.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="800" cy="370" r="4" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- 2. Shell (Dotted Amber) -->
      <polyline points="80,167.5 320,350 560,367.5 800,372.5" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="2,5" stroke-linecap="round" stroke-linejoin="round" />
      <g fill="#d97706">
        <circle cx="80" cy="167.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="320" cy="350" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="560" cy="367.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="800" cy="372.5" r="4" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- 3. Esso (Dashed Blue) -->
      <polyline points="80,150 320,367.5 560,372.5 800,375" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round" stroke-linejoin="round" />
      <g fill="#2563eb">
        <circle cx="80" cy="150" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="320" cy="367.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="560" cy="372.5" r="4" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="800" cy="375" r="4" stroke="#ffffff" stroke-width="1.5" />
      </g>
    </g>

    <!-- Legend (3-Column Layout at the bottom) -->
    <g transform="translate(100, 475)">
      <!-- Col 1: Tesco Fuel -->
      <g transform="translate(0, 0)">
        <line x1="0" y1="8" x2="30" y2="8" stroke="#0f172a" stroke-width="3.5" />
        <circle cx="15" cy="8" r="4.5" fill="#0f172a" stroke="#ffffff" stroke-width="1" />
        <text x="42" y="12" font-size="13" font-weight="600" fill="#334155">Tesco Fuel (approx. 26% MS)</text>
      </g>
      <!-- Col 2: Shell -->
      <g transform="translate(280, 0)">
        <line x1="0" y1="8" x2="30" y2="8" stroke="#d97706" stroke-width="3.5" stroke-dasharray="2,4" />
        <circle cx="15" cy="8" r="4.5" fill="#d97706" stroke="#ffffff" stroke-width="1" />
        <text x="42" y="12" font-size="13" font-weight="600" fill="#334155">Shell (approx. 11% MS)</text>
      </g>
      <!-- Col 3: Esso -->
      <g transform="translate(540, 0)">
        <line x1="0" y1="8" x2="30" y2="8" stroke="#2563eb" stroke-width="3.5" stroke-dasharray="6,4" />
        <circle cx="15" cy="8" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1" />
        <text x="42" y="12" font-size="13" font-weight="600" fill="#334155">Esso (approx. 4% MS)</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Sombra elegante para o contêiner do card -->
    <filter id="table-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Fundo do Card -->
  <rect x="30" y="30" width="940" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#table-shadow)" />

  <!-- Título da Tabela -->
  <g transform="translate(60, 75)">
    <text x="0" y="0" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">Table 2.4: Stability of heavy buyers in Malaysia (2011–12)</text>
  </g>

  <!-- ================= ESTRUTURA DA TABELA ================= -->
  <g transform="translate(0, 0)">
    
    <!-- Cabeçalho (Cantos Superiores Arredondados) -->
    <path d="M 60,155 v -45 a 8,8 0 0 1 8,-8 h 864 a 8,8 0 0 1 8,8 v 45 Z" fill="#475569" />

    <!-- Fundo de Linhas Alternadas -->
    <rect x="60" y="155" width="880" height="36" fill="#f8fafc" />
    <rect x="60" y="191" width="880" height="36" fill="#ffffff" />
    <rect x="60" y="227" width="880" height="36" fill="#f8fafc" />
    <rect x="60" y="263" width="880" height="36" fill="#ffffff" />
    <rect x="60" y="299" width="880" height="36" fill="#f8fafc" />
    <rect x="60" y="335" width="880" height="36" fill="#ffffff" />
    <rect x="60" y="371" width="880" height="36" fill="#f8fafc" />
    <rect x="60" y="407" width="880" height="36" fill="#ffffff" />
    
    <!-- Linha de Média (Average - Destacada em cinza escuro) -->
    <path d="M 60,443 h 880 v 28 a 8,8 0 0 1 -8,8 h -864 a 8,8 0 0 1 -8,-8 Z" fill="#e2e8f0" />

    <!-- Divisórias Verticais -->
    <line x1="280" y1="102" x2="280" y2="479" stroke="#cbd5e1" stroke-width="1" />
    <line x1="490" y1="102" x2="490" y2="479" stroke="#475569" stroke-width="2" /> <!-- Divisória central mais forte entre sabonetes e noodles -->
    <line x1="630" y1="102" x2="630" y2="479" stroke="#cbd5e1" stroke-width="1" />

    <!-- Divisórias Horizontais -->
    <line x1="60" y1="155" x2="940" y2="155" stroke="#334155" stroke-width="2" />
    <line x1="60" y1="191" x2="940" y2="191" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="227" x2="940" y2="227" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="263" x2="940" y2="263" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="299" x2="940" y2="299" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="335" x2="940" y2="335" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="371" x2="940" y2="371" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="407" x2="940" y2="407" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="443" x2="940" y2="443" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="60" y1="479" x2="940" y2="479" stroke="#cbd5e1" stroke-width="2" />


    <!-- ================= CONTEÚDO DE TEXTO E DADOS ================= -->

    <!-- CABEÇALHOS DAS COLUNAS (Texto Branco) -->
    <g font-size="14" font-weight="700" fill="#ffffff">
      <!-- Lado Esquerdo (Soap) -->
      <text x="85" y="136">Soap</text>
      <text x="385" y="136" text-anchor="middle">Top 20% stability</text>

      <!-- Lado Direito (Noodles) -->
      <text x="515" y="136">Noodles</text>
      <text x="785" y="136" text-anchor="middle">Top 20% stability</text>
    </g>


    <!-- LINHA 1 -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="178">Dettol Regular</text>
      <text x="385" y="178" text-anchor="middle" font-weight="500">47</text>
      
      <text x="515" y="178">Maggi</text>
      <text x="785" y="178" text-anchor="middle" font-weight="500">59</text>
    </g>

    <!-- LINHA 2 -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="214">Lux</text>
      <text x="385" y="214" text-anchor="middle" font-weight="500">42</text>
      
      <text x="515" y="214">Cintan</text>
      <text x="785" y="214" text-anchor="middle" font-weight="500">49</text>
    </g>

    <!-- LINHA 3 -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="250">May</text>
      <text x="385" y="250" text-anchor="middle" font-weight="500">29</text>
      
      <text x="515" y="250">Mamee</text>
      <text x="785" y="250" text-anchor="middle" font-weight="500">42</text>
    </g>

    <!-- LINHA 4 -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="286">Orchid Fruitale</text>
      <text x="385" y="286" text-anchor="middle" font-weight="500">46</text>
      
      <text x="515" y="286">Mie Sedaap</text>
      <text x="785" y="286" text-anchor="middle" font-weight="500">59</text>
    </g>

    <!-- LINHA 5 -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="322">Lifebuoy</text>
      <text x="385" y="322" text-anchor="middle" font-weight="500">30</text>
      
      <text x="515" y="322">Vits</text>
      <text x="785" y="322" text-anchor="middle" font-weight="500">38</text>
    </g>

    <!-- LINHA 6 -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="358">Protex</text>
      <text x="385" y="358" text-anchor="middle" font-weight="500">37</text>
      
      <text x="515" y="358">Private Label</text>
      <text x="785" y="358" text-anchor="middle" font-weight="500">53</text>
    </g>

    <!-- LINHA 7 -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="394">Antabax</text>
      <text x="385" y="394" text-anchor="middle" font-weight="500">48</text>
      
      <text x="515" y="394">Eka</text>
      <text x="785" y="394" text-anchor="middle" font-weight="500">42</text>
    </g>

    <!-- LINHA 8 -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="430">Palmolive Naturals</text>
      <text x="385" y="430" text-anchor="middle" font-weight="500">34</text>
      
      <text x="515" y="430">Jasmine</text>
      <text x="785" y="430" text-anchor="middle" font-weight="500">42</text>
    </g>

    <!-- LINHA DE MÉDIA (Average) -->
    <g fill="#0f172a" font-size="14" font-weight="800">
      <text x="85" y="466">Average</text>
      <text x="385" y="466" text-anchor="middle">39</text>
      
      <text x="515" y="466"></text> <!-- Vazio no original -->
      <text x="785" y="466" text-anchor="middle">48</text>
    </g>

  </g>

  <!-- Fonte dos Dados (Footer) -->
  <text x="940" y="525" font-size="13" font-weight="500" font-style="italic" fill="#64748b" text-anchor="end">Source: Kantar WorldPanel Malaysia</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title -->
  <text x="50" y="55" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">
    FIGURA 6.1 Mapa perceptivo — leites aromatizados
  </text>

  <!-- ================= MAP AXES (VECTORS) ================= -->
  <!-- Central Intersection Point -->
  <circle cx="430" cy="310" r="4" fill="#475569" />

  <!-- Vector 1: Up-Left (Trabalhadores braçais) -->
  <line x1="430" y1="310" x2="140" y2="200" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" />

  <!-- Vector 2: Up-Right (Saudável) -->
  <line x1="430" y1="310" x2="900" y2="170" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" />

  <!-- Vector 3: Down-Left (Doce) -->
  <line x1="430" y1="310" x2="340" y2="590" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" />

  <!-- Vector 4: Down-Right (Almofadinhas) -->
  <line x1="430" y1="310" x2="720" y2="420" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" />


  <!-- ================= BRAND PILLS ================= -->
  <!-- Max Brand (Top-Left) -->
  <g transform="translate(165, 130)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Max</text>
  </g>

  <!-- FU Brand (Middle-Left) -->
  <g transform="translate(160, 340)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">FU</text>
  </g>

  <!-- DV Brand (Bottom-Center) -->
  <g transform="translate(410, 510)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">DV</text>
  </g>

  <!-- FG Brand (Top-Right) -->
  <g transform="translate(750, 215)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">FG</text>
  </g>

  <!-- TC Brand (Top-Right-Far) -->
  <g transform="translate(820, 235)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">TC</text>
  </g>


  <!-- ================= LABELS & ATTRIBUTES ================= -->
  <!-- Top-Left Area -->
  <text x="50" y="110" font-size="14" font-weight="700" fill="#0f172a">Robusto</text>
  <text x="55" y="160" font-size="14" font-weight="600" fill="#334155">Homens</text>
  <text x="60" y="215" font-size="14" font-weight="600" fill="#475569">Trabalhadores braçais</text>
  <text x="60" y="285" font-size="14" font-weight="600" fill="#475569">Alta concentração de cafeína</text>

  <!-- Left-Center / Bottom-Left Area -->
  <text x="160" y="395" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Popular</text>
  <text x="190" y="590" font-size="14" font-weight="600" fill="#475569">Tradicional</text>
  <text x="250" y="240" font-size="14" font-weight="600" fill="#475569">Cura para ressaca</text>
  <text x="350" y="380" font-size="14" font-weight="600" fill="#475569">Fresco</text>
  <text x="275" y="450" font-size="14" font-weight="600" fill="#475569">Engorda</text>

  <!-- Center-Right / Bottom Area -->
  <text x="440" y="370" font-size="14" font-weight="600" fill="#475569">Pessoas feias</text>
  <text x="410" y="485" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Sul da Austrália</text>
  <text x="410" y="555" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Marca infantil</text>
  <text x="355" y="600" font-size="14" font-weight="600" fill="#475569">Marca premium</text>
  <text x="310" y="635" font-size="14" font-weight="700" fill="#0f172a">Doce</text>

  <!-- Bottom-Right Area -->
  <text x="675" y="445" font-size="14" font-weight="600" fill="#475569">Almofadinhas</text>

  <!-- Top-Right Area -->
  <text x="590" y="225" font-size="14" font-weight="600" fill="#475569">Impopular</text>
  <text x="740" y="140" font-size="14" font-weight="600" fill="#475569">Baixo teor de gordura</text>
  <text x="790" y="185" font-size="14" font-weight="600" fill="#475569">Novidade</text>
  <text x="870" y="160" font-size="14" font-weight="700" fill="#0f172a">Saudável</text>
  <text x="715" y="250" font-size="14" font-weight="600" fill="#475569">Nutritivo</text>
  <text x="640" y="275" font-size="14" font-weight="600" fill="#475569">Marca desconhecida</text>
  <text x="690" y="300" font-size="14" font-weight="600" fill="#475569">Mulheres</text>
  <text x="640" y="325" font-size="14" font-weight="600" fill="#475569">Pessoas bonitas</text>
</svg>

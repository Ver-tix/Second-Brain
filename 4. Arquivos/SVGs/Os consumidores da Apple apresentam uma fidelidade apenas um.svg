<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title Section -->
  <text x="50" y="45" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">
    TABELA 7.5 Os consumidores da Apple apresentam uma fidelidade apenas um
  </text>
  <text x="50" y="70" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">
    pouco alta
  </text>

  <!-- ================= HEADER SECTION ================= -->
  <!-- Column 1: Marca -->
  <rect x="50" y="100" width="400" height="50" fill="#475569" stroke="#ffffff" stroke-width="1.5" rx="4" />
  <text x="250" y="131" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Marca</text>

  <!-- Column 2: Compras repetidas (%) -->
  <rect x="450" y="100" width="400" height="50" fill="#475569" stroke="#ffffff" stroke-width="1.5" rx="4" />
  <text x="650" y="131" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Compras repetidas (%)</text>


  <!-- ================= DATA ROWS ================= -->
  
  <!-- Row 1: Dell -->
  <rect x="50" y="150" width="400" height="45" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="250" y="178" font-size="15" fill="#1e293b" text-anchor="middle">Dell</text>
  
  <rect x="450" y="150" width="400" height="45" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="650" y="178" font-size="15" fill="#1e293b" text-anchor="middle">71</text>

  <!-- Row 2: Apple -->
  <rect x="50" y="195" width="400" height="45" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="250" y="223" font-size="15" fill="#1e293b" text-anchor="middle">Apple</text>
  
  <rect x="450" y="195" width="400" height="45" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="650" y="223" font-size="15" fill="#1e293b" text-anchor="middle">55</text>

  <!-- Row 3: HP/Compaq -->
  <rect x="50" y="240" width="400" height="45" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="250" y="268" font-size="15" fill="#1e293b" text-anchor="middle">HP/Compaq</text>
  
  <rect x="450" y="240" width="400" height="45" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="650" y="268" font-size="15" fill="#1e293b" text-anchor="middle">52</text>

  <!-- Row 4: Gateway -->
  <rect x="50" y="285" width="400" height="45" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="250" y="313" font-size="15" fill="#1e293b" text-anchor="middle">Gateway</text>
  
  <rect x="450" y="285" width="400" height="45" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="650" y="313" font-size="15" fill="#1e293b" text-anchor="middle">52</text>


  <!-- ================= FOOTER ================= -->
  <text x="850" y="365" font-size="14" fill="#64748b" text-anchor="end">
    Fonte: Metafacts Inc., 2002-2003, &lt;http://www.technologyuserprofile.com&gt;.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2000" width="100%" height="100%" role="img">
<title>Os Guias e As Advertências</title>
<desc>Dois diagramas espelhados de arquétipos narrativos. "Os Guias" mostra a jornada positiva: da aventura, passando por transformações (redenções, histórias de enjeitados, patinho feio), interdependência e individuação, até o paraíso encontrado. "As Advertências" mostra o espelho negativo: da anarquia, passando por paraíso perdido, os três porquinhos e a voz solitária, conformidade e isolamento, até brincando de Deus.</desc>

<style>
  .lbl-section { font: bold 30px sans-serif; fill: #f8fafc; }
  .lbl-box { font: bold 19px sans-serif; fill: #f8fafc; }
  .lbl-text { font: bold 17px sans-serif; fill: #f8fafc; }
  .lbl-caption { font: italic bold 16px sans-serif; fill: #cbd5e1; }
  .box { fill: #1e293b; stroke: #e2e8f0; stroke-width: 2; }
  .tagbg { fill: #0f172a; stroke: #475569; stroke-width: 1; }
  .line { stroke: #cbd5e1; stroke-width: 2; fill: none; }
  .arc { stroke: #94a3b8; stroke-width: 18; fill: none; opacity: 0.55; }
  .rule { stroke: #f8fafc; stroke-width: 3; }
</style>
<defs>
<marker id="arrow-light" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L9 5L1 9 Z" fill="#94a3b8"/></marker>
<marker id="arrowd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- ============ PANEL 1: OS GUIAS ============ -->
<text class="lbl-section" x="20" y="45">Os Guias</text>
<line x1="20" y1="65" x2="1380" y2="65" class="rule"/>

<!-- Arc -->
<path d="M180,650 C150,300 420,110 700,110 C960,110 1150,150 1240,195" class="arc" marker-end="url(#arrow-light)"/>

<rect x="130" y="330" width="230" height="46" rx="8" class="tagbg"/>
<text class="lbl-text" x="245" y="360" text-anchor="middle" transform="rotate(-58 245 360)">Anjo Errante</text>

<rect x="880" y="185" width="180" height="42" rx="8" class="tagbg"/>
<text class="lbl-text" x="970" y="212" text-anchor="middle">A Jornada</text>

<rect x="1200" y="150" width="180" height="70" rx="8" class="tagbg"/>
<text class="lbl-text" x="1290" y="175" text-anchor="middle">Paraíso</text>
<text class="lbl-text" x="1290" y="198" text-anchor="middle">Encontrado</text>

<!-- Aventura box -->
<rect x="610" y="90" width="180" height="50" rx="8" class="box"/>
<text class="lbl-box" x="700" y="120" text-anchor="middle">Aventura</text>

<line x1="700" y1="140" x2="700" y2="270" class="line"/>
<rect x="580" y="270" width="240" height="42" rx="8" class="tagbg"/>
<text class="lbl-text" x="700" y="297" text-anchor="middle">Transformações</text>

<!-- Horizontal line: Interdependência - Individuação -->
<rect x="130" y="440" width="270" height="48" rx="8" class="box"/>
<text class="lbl-box" x="265" y="470" text-anchor="middle">Interdependência</text>
<rect x="1000" y="440" width="270" height="48" rx="8" class="box"/>
<text class="lbl-box" x="1135" y="470" text-anchor="middle">Individuação</text>
<line x1="400" y1="464" x2="1000" y2="464" class="line"/>

<!-- Three arrows from Transformações crossing the line -->
<line x1="700" y1="315" x2="490" y2="560" class="line" marker-end="url(#arrowd)"/>
<line x1="700" y1="315" x2="700" y2="560" class="line" marker-end="url(#arrowd)"/>
<line x1="700" y1="315" x2="920" y2="560" class="line" marker-end="url(#arrowd)"/>

<rect x="400" y="565" width="180" height="42" rx="8" class="tagbg"/>
<text class="lbl-text" x="490" y="592" text-anchor="middle">Redenções</text>

<rect x="590" y="565" width="230" height="70" rx="8" class="tagbg"/>
<text class="lbl-text" x="705" y="590" text-anchor="middle">Histórias de</text>
<text class="lbl-text" x="705" y="613" text-anchor="middle">Enjeitados</text>

<rect x="840" y="565" width="180" height="70" rx="8" class="tagbg"/>
<text class="lbl-text" x="930" y="590" text-anchor="middle">Patinho</text>
<text class="lbl-text" x="930" y="613" text-anchor="middle">Feio</text>

<rect x="390" y="650" width="200" height="42" rx="8" class="tagbg"/>
<text class="lbl-text" x="490" y="677" text-anchor="middle">Paraíso Visitado</text>

<rect x="150" y="750" width="260" height="70" rx="8" class="tagbg"/>
<text class="lbl-text" x="280" y="775" text-anchor="middle">Paraíso</text>
<text class="lbl-text" x="280" y="798" text-anchor="middle">(Quase) Perdido</text>

<line x1="705" y1="635" x2="705" y2="750" class="line"/>
<rect x="610" y="750" width="190" height="46" rx="8" class="box"/>
<text class="lbl-box" x="705" y="780" text-anchor="middle">Segurança</text>

<!-- ============ PANEL 2: AS ADVERTÊNCIAS ============ -->
<text class="lbl-section" x="20" y="1050">As Advertências</text>
<line x1="20" y1="1070" x2="1380" y2="1070" class="rule"/>

<path d="M180,1655 C150,1305 420,1115 700,1115 C960,1115 1150,1155 1240,1200" class="arc" marker-end="url(#arrow-light)"/>

<rect x="60" y="1155" width="220" height="42" rx="8" class="tagbg"/>
<text class="lbl-text" x="170" y="1182" text-anchor="middle">Apocalipse</text>

<rect x="130" y="1310" width="280" height="46" rx="8" class="tagbg"/>
<text class="lbl-text" x="270" y="1338" text-anchor="middle" transform="rotate(-58 270 1338)">O Espírito do Mal</text>

<rect x="880" y="1190" width="180" height="42" rx="8" class="tagbg"/>
<text class="lbl-text" x="970" y="1217" text-anchor="middle">O Vampiro</text>

<rect x="1190" y="1150" width="190" height="70" rx="8" class="tagbg"/>
<text class="lbl-text" x="1285" y="1175" text-anchor="middle">Brincando</text>
<text class="lbl-text" x="1285" y="1198" text-anchor="middle">de Deus</text>

<rect x="610" y="1095" width="180" height="50" rx="8" class="box"/>
<text class="lbl-box" x="700" y="1125" text-anchor="middle">Anarquia</text>

<line x1="700" y1="1145" x2="700" y2="1240" class="line"/>
<rect x="600" y="1250" width="230" height="42" rx="8" class="tagbg"/>
<text class="lbl-text" x="715" y="1277" text-anchor="middle">As Sombras</text>
<rect x="560" y="1300" width="290" height="42" rx="8" class="tagbg"/>
<text class="lbl-text" x="705" y="1327" text-anchor="middle">Tristão &amp; Isolda</text>

<rect x="130" y="1440" width="270" height="48" rx="8" class="box"/>
<text class="lbl-box" x="265" y="1470" text-anchor="middle">Conformidade</text>
<rect x="1000" y="1440" width="270" height="48" rx="8" class="box"/>
<text class="lbl-box" x="1135" y="1470" text-anchor="middle">Isolamento</text>
<line x1="400" y1="1464" x2="1000" y2="1464" class="line"/>

<line x1="700" y1="1370" x2="490" y2="1560" class="line" marker-end="url(#arrowd)"/>
<line x1="700" y1="1370" x2="700" y2="1560" class="line" marker-end="url(#arrowd)"/>
<line x1="700" y1="1370" x2="920" y2="1560" class="line" marker-end="url(#arrowd)"/>

<rect x="400" y="1565" width="180" height="70" rx="8" class="tagbg"/>
<text class="lbl-text" x="490" y="1590" text-anchor="middle">Paraíso</text>
<text class="lbl-text" x="490" y="1613" text-anchor="middle">Perdido</text>

<rect x="595" y="1565" width="220" height="70" rx="8" class="tagbg"/>
<text class="lbl-text" x="705" y="1590" text-anchor="middle">Os Três</text>
<text class="lbl-text" x="705" y="1613" text-anchor="middle">Porquinhos</text>

<rect x="840" y="1565" width="190" height="70" rx="8" class="tagbg"/>
<text class="lbl-text" x="935" y="1590" text-anchor="middle">A Voz</text>
<text class="lbl-text" x="935" y="1613" text-anchor="middle">Solitária</text>

<line x1="705" y1="1635" x2="705" y2="1750" class="line"/>
<rect x="610" y="1750" width="190" height="46" rx="8" class="box"/>
<text class="lbl-box" x="705" y="1780" text-anchor="middle">Paralisia</text>

<rect x="80" y="1870" width="230" height="42" rx="8" class="tagbg"/>
<text class="lbl-text" x="195" y="1897" text-anchor="middle">Os Lemingues</text>

<text class="lbl-caption" x="20" y="1970">Figura 6.6</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Premium drop shadow for the container card -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="30" y="30" width="940" height="640" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Figure Title -->
  <g transform="translate(60, 80)">
    <text x="0" y="0" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">Figure 1.3: Double jeopardy in banks in India (2014)</text>
  </g>

  <!-- ================= CHART AREA ================= -->
  <!-- 
    X-axis Range: 0 to 100% -> Pixel range: 250 to 850 (Width: 600px)
    Y-axis Range: 0 to 4.0  -> Pixel range: 550 to 150 (Height: 400px)
  -->
  <g id="chart-grid">
    <!-- Horizontal Gridlines & Y-Axis Labels -->
    <!-- 4.0 Gridline -->
    <line x1="250" y1="150" x2="850" y2="150" stroke="#cbd5e1" stroke-width="1" />
    <text x="230" y="155" font-size="15" font-weight="600" fill="#64748b" text-anchor="end">4.0</text>

    <!-- 3.0 Gridline -->
    <line x1="250" y1="250" x2="850" y2="250" stroke="#cbd5e1" stroke-width="1" />
    <text x="230" y="255" font-size="15" font-weight="600" fill="#64748b" text-anchor="end">3.0</text>

    <!-- 2.0 Gridline -->
    <line x1="250" y1="350" x2="850" y2="350" stroke="#cbd5e1" stroke-width="1.25" />
    <text x="230" y="355" font-size="15" font-weight="600" fill="#64748b" text-anchor="end">2.0</text>

    <!-- 1.0 Gridline -->
    <line x1="250" y1="450" x2="850" y2="450" stroke="#cbd5e1" stroke-width="1" />
    <text x="230" y="455" font-size="15" font-weight="600" fill="#64748b" text-anchor="end">1.0</text>

    <!-- Baseline (0) -->
    <line x1="250" y1="550" x2="850" y2="550" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <text x="230" y="555" font-size="15" font-weight="600" fill="#64748b" text-anchor="end">0</text>

    <!-- X-Axis Ticks & Labels -->
    <!-- Tick at 25% (x = 400) -->
    <line x1="400" y1="550" x2="400" y2="558" stroke="#1e293b" stroke-width="1.5" />
    <text x="400" y="580" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">25</text>

    <!-- Tick at 50% (x = 550) -->
    <line x1="550" y1="550" x2="550" y2="558" stroke="#1e293b" stroke-width="1.5" />
    <text x="550" y="580" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">50</text>

    <!-- Tick at 75% (x = 700) -->
    <line x1="700" y1="550" x2="700" y2="558" stroke="#1e293b" stroke-width="1.5" />
    <text x="700" y="580" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">75</text>

    <!-- Tick at 100% (x = 850) -->
    <line x1="850" y1="550" x2="850" y2="558" stroke="#1e293b" stroke-width="1.5" />
    <text x="850" y="580" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">100</text>
  </g>

  <!-- Axis Labels -->
  <!-- Y-Axis Title -->
  <g transform="translate(105, 350) rotate(-90)">
    <text text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" letter-spacing="-0.01em">
      <tspan x="0" dy="-8">Average number of</tspan>
      <tspan x="0" dy="20">products with bank</tspan>
    </text>
  </g>

  <!-- X-Axis Title -->
  <text x="550" y="625" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="-0.01em">Brand penetration (%)</text>


  <!-- ================= PLOTTED DATA POINTS & LABELS ================= -->
  <!-- 
    Data Point Style: White filled circles with dark slate borders 
  -->
  <g id="data-points">
    <!-- Unlabelled Cluster Points -->
    <circle cx="280" cy="405" r="6" fill="#ffffff" stroke="#334155" stroke-width="2.5" /> <!-- approx (5%, 1.45) -->
    <circle cx="295" cy="400" r="6" fill="#ffffff" stroke="#334155" stroke-width="2.5" /> <!-- approx (7.5%, 1.5) -->
    <circle cx="308" cy="385" r="6" fill="#ffffff" stroke="#334155" stroke-width="2.5" /> <!-- approx (9.6%, 1.65) -->
    <circle cx="305" cy="373" r="6" fill="#ffffff" stroke="#334155" stroke-width="2.5" /> <!-- approx (9.1%, 1.77) -->
    
    <!-- Central Bank of India Point (8%, 1.6) -> x=298, y=390 -->
    <circle cx="298" cy="390" r="6" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    
    <circle cx="320" cy="410" r="6" fill="#ffffff" stroke="#334155" stroke-width="2.5" /> <!-- approx (11.6%, 1.4) -->
    <circle cx="330" cy="400" r="6" fill="#ffffff" stroke="#334155" stroke-width="2.5" /> <!-- approx (13.3%, 1.5) -->
    <circle cx="340" cy="380" r="6" fill="#ffffff" stroke="#334155" stroke-width="2.5" /> <!-- approx (15%, 1.7) -->
    <circle cx="345" cy="390" r="6" fill="#ffffff" stroke="#334155" stroke-width="2.5" /> <!-- approx (15.8%, 1.6) -->

    <!-- Axis Point (34%, 1.9) -> x=454, y=360 -->
    <circle cx="454" cy="360" r="6" fill="#ffffff" stroke="#0f172a" stroke-width="3" />

    <!-- Points around 50% (46%, 2.1) & (50%, 2.1) -> x=526/550, y=340 -->
    <circle cx="526" cy="342" r="6" fill="#ffffff" stroke="#334155" stroke-width="2.5" />
    <circle cx="550" cy="340" r="6" fill="#ffffff" stroke="#334155" stroke-width="2.5" />

    <!-- State Bank of India Point (66%, 2.0) -> x=646, y=350 -->
    <circle cx="646" cy="350" r="6" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
  </g>

  <!-- ================= CALLOUT LABELS ================= -->
  <g id="labels">
    <!-- Central Bank of India Label (Placed below its point x=298, y=390) -->
    <text x="298" y="426" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
      <tspan x="298" dy="0">Central Bank</tspan>
      <tspan x="298" dy="17">of India</tspan>
      <tspan x="298" dy="17" font-weight="600" fill="#475569">8%; 1.6</tspan>
    </text>

    <!-- Axis Label (Placed above its point x=454, y=360) -->
    <text x="454" y="325" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
      <tspan x="454" dy="0">Axis</tspan>
      <tspan x="454" dy="17" font-weight="600" fill="#475569">34%; 1.9</tspan>
    </text>

    <!-- State Bank of India Label (Placed above its point x=646, y=350) -->
    <text x="646" y="315" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
      <tspan x="646" dy="0">State Bank of India</tspan>
      <tspan x="646" dy="17" font-weight="600" fill="#475569">66%; 2.0</tspan>
    </text>
  </g>
</svg>

  <circle cx="300" cy="150" r="80" class="circle" />
  <circle cx="210" cy="300" r="80" class="circle" />
  <circle cx="390" cy="300" r="80" class="circle" />

  <!-- Rótulos e Ícones -->
  
  <!-- Ownership -->
  <text x="300" y="130" class="text">Ownership</text>

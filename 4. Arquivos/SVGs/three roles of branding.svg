<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background-color: white;">
  <defs>
    <style>
      .circle { fill: #c8c8c8; opacity: 0.9; }
      .text { font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .icon { font-size: 40px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Título -->
  <text x="50" y="30" font-family="sans-serif" font-size="18" font-weight="bold">Figure 3.1: The three roles of branding</text>


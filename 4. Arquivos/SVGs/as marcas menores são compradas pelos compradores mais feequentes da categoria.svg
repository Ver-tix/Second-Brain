<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title -->
  <text x="30" y="55" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">
    TABELA 7.2 As marcas menores são compradas pelos compradores mais frequentes
  </text>
  <text x="30" y="80" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">
    da categoria
  </text>

  <!-- ================= HEADER SECTION ================= -->
  <!-- Col 1: Marcas de ketchup (x=30, w=150) -->
  <rect x="30" y="100" width="150" height="90" fill="#475569" stroke="#ffffff" stroke-width="2" rx="4" />
  <text x="105" y="140" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Marcas de</text>
  <text x="105" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ketchup</text>

  <!-- Col 2: Participação de mercado (%) (x=180, w=180) -->
  <rect x="180" y="100" width="180" height="90" fill="#475569" stroke="#ffffff" stroke-width="2" rx="4" />
  <text x="270" y="140" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Participação</text>
  <text x="270" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">de mercado (%)</text>

  <!-- Col 3: Penetração (%) (x=360, w=160) -->
  <rect x="360" y="100" width="160" height="90" fill="#475569" stroke="#ffffff" stroke-width="2" rx="4" />
  <text x="440" y="140" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Penetração</text>
  <text x="440" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">(%)</text>

  <!-- Col 4: Frequência de compra da marca (x=520, w=220) -->
  <rect x="520" y="100" width="220" height="90" fill="#475569" stroke="#ffffff" stroke-width="2" rx="4" />
  <text x="630" y="130" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Frequência de</text>
  <text x="630" y="150" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">compra da marca</text>
  <text x="630" y="170" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">(unidades por ano)</text>

  <!-- Col 5: Frequência de compra de qualquer marca (x=740, w=230) -->
  <rect x="740" y="100" width="230" height="90" fill="#475569" stroke="#ffffff" stroke-width="2" rx="4" />
  <text x="855" y="120" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Frequência</text>
  <text x="855" y="140" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">de compra de</text>
  <text x="855" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">qualquer marca</text>
  <text x="855" y="180" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">(unidades por ano)</text>


  <!-- ================= DATA ROWS ================= -->
  
  <!-- ROW 1: Heinz (y=190) -->
  <rect x="30" y="190" width="150" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="105" y="220" font-size="15" fill="#1e293b" text-anchor="middle">Heinz</text>
  
  <rect x="180" y="190" width="180" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="250" y="220" font-size="15" fill="#1e293b" text-anchor="middle">53</text>
  
  <rect x="360" y="190" width="160" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="430" y="220" font-size="15" fill="#1e293b" text-anchor="middle">50</text>
  
  <rect x="520" y="190" width="220" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="610" y="220" font-size="15" fill="#1e293b" text-anchor="middle">2,9</text>
  
  <rect x="740" y="190" width="230" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="830" y="220" font-size="15" fill="#1e293b" text-anchor="middle">4</text>

  <!-- ROW 2: Daddies (y=240) -->
  <rect x="30" y="240" width="150" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="105" y="270" font-size="15" fill="#1e293b" text-anchor="middle">Daddies</text>
  
  <rect x="180" y="240" width="180" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="250" y="270" font-size="15" fill="#1e293b" text-anchor="middle">4</text>
  
  <rect x="360" y="240" width="160" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="430" y="270" font-size="15" fill="#1e293b" text-anchor="middle">5</text>
  
  <rect x="520" y="240" width="220" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="610" y="270" font-size="15" fill="#1e293b" text-anchor="middle">2</text>
  
  <rect x="740" y="240" width="230" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="830" y="270" font-size="15" fill="#1e293b" text-anchor="middle">6</text>

  <!-- ROW 3: C&B (y=290) -->
  <rect x="30" y="290" width="150" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="105" y="320" font-size="15" fill="#1e293b" text-anchor="middle">C&amp;B</text>
  
  <rect x="180" y="290" width="180" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="250" y="320" font-size="15" fill="#1e293b" text-anchor="middle">1</text>
  
  <rect x="360" y="290" width="160" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="430" y="320" font-size="15" fill="#1e293b" text-anchor="middle">2</text>
  
  <rect x="520" y="290" width="220" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="610" y="320" font-size="15" fill="#1e293b" text-anchor="middle">1,2</text>
  
  <rect x="740" y="290" width="230" height="50" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="830" y="320" font-size="15" fill="#1e293b" text-anchor="middle">8</text>


  <!-- ================= ARROWS ================= -->
  <!-- Col 2: Down Arrow -->
  <line x1="320" y1="210" x2="320" y2="320" stroke="#0f172a" stroke-width="2" />
  <polygon points="315,315 325,315 320,325" fill="#0f172a" />

  <!-- Col 3: Down Arrow -->
  <line x1="490" y1="210" x2="490" y2="320" stroke="#0f172a" stroke-width="2" />
  <polygon points="485,315 495,315 490,325" fill="#0f172a" />

  <!-- Col 4: Down Arrow -->
  <line x1="695" y1="210" x2="695" y2="320" stroke="#0f172a" stroke-width="2" />
  <polygon points="690,315 700,315 695,325" fill="#0f172a" />

  <!-- Col 5: Up Arrow -->
  <line x1="910" y1="325" x2="910" y2="215" stroke="#0f172a" stroke-width="2" />
  <polygon points="905,220 915,220 910,210" fill="#0f172a" />


  <!-- ================= FOOTER ================= -->
  <text x="970" y="380" font-size="14" fill="#64748b" text-anchor="end">Fonte: TNS.</text>
</svg>

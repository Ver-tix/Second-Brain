  <!-- Observations -->
  <text x="60" y="435" font-size="14.5" font-weight="700" fill="#0f172a">Observações:</text>
  
  <text x="60" y="460" font-size="14" fill="#334155">
    As linhas e as colunas são ordenadas por popularidade do nível de preço.
  </text>
  <text x="60" y="485" font-size="14" fill="#334155">
    Os compradores de qualquer nível de preço também compram em outros níveis de preço, mais ou menos de
  </text>
  <text x="60" y="505" font-size="14" fill="#334155">
    acordo com a participação de mercado desses outros níveis de preço.
  </text>
  
  <!-- Source -->
  <text x="940" y="540" font-size="14" fill="#64748b" text-anchor="end">Fonte: TNS.</text>

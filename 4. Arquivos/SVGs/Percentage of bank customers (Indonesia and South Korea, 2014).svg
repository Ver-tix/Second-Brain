<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" style="background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Título -->
  <text x="50" y="40" font-size="20" font-weight="bold" fill="#0f172a">Figure 3.1: Percentage of bank customers (Indonesia and South Korea, 2014)</text>

  <!-- Gráfico (a) Indonesia -->
  <text x="50" y="90" font-size="18" font-weight="bold" fill="#475569">(a) Indonesia</text>
  <rect x="50" y="110" width="850" height="250" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)" />
  
  <!-- Barras (a) -->
  <g fill="#64748b">
    <rect x="100" y="240" width="60" height="100" /> <text x="130" y="230" text-anchor="middle" font-size="14" fill="#ffffff">58</text>
    <rect x="190" y="270" width="60" height="70" />  <text x="220" y="260" text-anchor="middle" font-size="14" fill="#ffffff">35</text>
    <rect x="280" y="282" width="60" height="58" />  <text x="310" y="272" text-anchor="middle" font-size="14" fill="#ffffff">28</text>
    <rect x="370" y="282" width="60" height="58" />  <text x="400" y="272" text-anchor="middle" font-size="14" fill="#ffffff">28</text>
    <rect x="460" y="328" width="60" height="12" />  <text x="490" y="318" text-anchor="middle" font-size="14" fill="#64748b">6</text>
    <rect x="550" y="308" width="60" height="32" />  <text x="580" y="298" text-anchor="middle" font-size="14" fill="#ffffff">16</text>
    <rect x="640" y="326" width="60" height="14" />  <text x="670" y="316" text-anchor="middle" font-size="14" fill="#64748b">7</text>
    <rect x="730" y="310" width="60" height="30" />  <text x="760" y="300" text-anchor="middle" font-size="14" fill="#ffffff">15</text>
    <rect x="820" y="324" width="60" height="16" />  <text x="850" y="314" text-anchor="middle" font-size="14" fill="#64748b">8</text>
  </g>

  <!-- Gráfico (b) South Korea -->
  <text x="50" y="420" font-size="18" font-weight="bold" fill="#475569">(b) South Korea</text>
  <rect x="50" y="440" width="850" height="250" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)" />
  
  <!-- Barras (b) -->
  <g fill="#64748b">
    <rect x="100" y="520" width="60" height="150" /> <text x="130" y="510" text-anchor="middle" font-size="14" fill="#ffffff">41</text>
    <rect x="190" y="570" width="60" height="100" /> <text x="220" y="560" text-anchor="middle" font-size="14" fill="#ffffff">24</text>
    <rect x="280" y="540" width="60" height="130" /> <text x="310" y="530" text-anchor="middle" font-size="14" fill="#ffffff">36</text>
    <rect x="370" y="550" width="60" height="120" /> <text x="400" y="540" text-anchor="middle" font-size="14" fill="#ffffff">33</text>
    <rect x="460" y="565" width="60" height="105" /> <text x="490" y="555" text-anchor="middle" font-size="14" fill="#ffffff">26</text>
    <rect x="550" y="590" width="60" height="80" />  <text x="580" y="580" text-anchor="middle" font-size="14" fill="#ffffff">19</text>
    <rect x="640" y="615" width="60" height="55" />  <text x="670" y="605" text-anchor="middle" font-size="14" fill="#ffffff">12</text>
    <rect x="730" y="625" width="60" height="45" />  <text x="760" y="615" text-anchor="middle" font-size="14" fill="#ffffff">11</text>
    <rect x="820" y="610" width="60" height="60" />  <text x="850" y="600" text-anchor="middle" font-size="14" fill="#ffffff">18</text>
  </g>
</svg>

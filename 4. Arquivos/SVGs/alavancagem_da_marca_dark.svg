<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Diagrama mostrando as formas de alavancar a marca: extensões de linha, esticar a marca verticalmente, extensões de marca e co-branding; com esticar a marca verticalmente se dividindo em esticar para baixo e para cima, e extensões de marca se dividindo em extensões ad hoc e criação de uma marca de linha. Cores adaptadas para fundo escuro.</desc>



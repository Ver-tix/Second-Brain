<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="background-color: #d8c3b0; font-family: sans-serif;">
  <defs>
    <!-- Marcador de Seta -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b3a2b" />
    </marker>
  </defs>

  <!-- Linhas Pontilhadas Internas (Quadrantes) -->
  <line x1="270" y1="70" x2="270" y2="410" stroke="#8b3a2b" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="100" y1="240" x2="440" y2="240" stroke="#8b3a2b" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Eixo Y (Custos) -->
  <line x1="100" y1="410" x2="100" y2="60" stroke="#8b3a2b" stroke-width="3" marker-end="url(#arrow)" />
  <!-- Eixo X (Benefícios) -->
  <line x1="100" y1="410" x2="450" y2="410" stroke="#8b3a2b" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Rótulo do Eixo Y -->
  <text x="-240" y="55" fill="#8b3a2b" font-size="20" font-weight="300" transform="rotate(-90)" text-anchor="middle">Custos</text>
  <!-- Rótulo do Eixo X -->
  <text x="275" y="450" fill="#8b3a2b" font-size="20" font-weight="300" text-anchor="middle">Benefícios</text>

  <!-- Quadrante Superior Esquerdo -->
  <text x="180" y="150" fill="#8b3a2b" font-size="18" text-anchor="middle">
    <tspan x="180" dy="0">Custo Alto</tspan>
    <tspan x="180" dy="25">Benefício Baixo</tspan>
  </text>

  <!-- Quadrante Superior Direito -->
  <text x="360" y="150" fill="#8b3a2b" font-size="18" text-anchor="middle">
    <tspan x="360" dy="0">Custo Alto</tspan>
    <tspan x="360" dy="25">Benefício Alto</tspan>
  </text>

  <!-- Quadrante Inferior Esquerdo -->
  <text x="180" y="320" fill="#8b3a2b" font-size="18" text-anchor="middle">
    <tspan x="180" dy="0">Custo Baixo</tspan>
    <tspan x="180" dy="25">Benefício Baixo</tspan>
  </text>

  <!-- Quadrante Inferior Direito -->
  <text x="360" y="320" fill="#8b3a2b" font-size="18" text-anchor="middle">
    <tspan x="360" dy="0">Custo Baixo</tspan>
    <tspan x="360" dy="25">Benefício Alto</tspan>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Sombra elegante para o contêiner do card -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <!-- Gradiente premium para as barras (base slate/dark moderno) -->
    <linearGradient id="bar-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Sombra sutil para as barras -->
    <filter id="bar-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Fundo do Card -->
  <rect x="30" y="30" width="940" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Título do Gráfico -->
  <g transform="translate(60, 75)">
    <text x="0" y="0" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">Figure 2.3: Category purchase frequency for biscuits in India (2011)</text>
  </g>

  <!-- ================= ÁREA DO GRÁFICO ================= -->
  <g transform="translate(0, 20)">
    
    <!-- Linhas de Grade (Y-axis gridlines) -->
    <!-- Grid 60% -->
    <line x1="140" y1="160" x2="890" y2="160" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Grid 40% -->
    <line x1="140" y1="260" x2="890" y2="260" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Grid 20% -->
    <line x1="140" y1="360" x2="890" y2="360" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Eixo X (Linha de base 0%) -->
    <line x1="140" y1="460" x2="890" y2="460" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Rótulos do Eixo Y -->
    <g font-size="14" font-weight="700" fill="#475569" text-anchor="end">
      <text x="120" y="165">60</text>
      <text x="120" y="265">40</text>
      <text x="120" y="365">20</text>
      <text x="120" y="465">0</text>
    </g>

    <!-- Título do Eixo Y (Rotacionado) -->
    <text transform="rotate(-90)" x="-310" y="70" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.01em">Category buyers (%)</text>

    <!-- ================= BARRAS E VALORES ================= -->
    
    <!-- Barra 1: 1-5 (26%) -->
    <g>
      <!-- Altura: 26 * 5 = 130px. Y: 460 - 130 = 330px -->
      <rect x="192" y="330" width="80" height="130" rx="4" fill="url(#bar-gradient)" filter="url(#bar-shadow)" />
      <!-- Valor acima da barra -->
      <text x="232" y="318" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">26</text>
      <!-- Rótulo do Eixo X -->
      <text x="232" y="492" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">1–5</text>
    </g>

    <!-- Barra 2: 6-10 (25%) -->
    <g>
      <!-- Altura: 25 * 5 = 125px. Y: 460 - 125 = 335px -->
      <rect x="336" y="335" width="80" height="125" rx="4" fill="url(#bar-gradient)" filter="url(#bar-shadow)" />
      <!-- Valor acima da barra -->
      <text x="376" y="323" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">25</text>
      <!-- Rótulo do Eixo X -->
      <text x="376" y="492" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">6–10</text>
    </g>

    <!-- Barra 3: 11-15 (19%) -->
    <g>
      <!-- Altura: 19 * 5 = 95px. Y: 460 - 95 = 365px -->
      <rect x="480" y="365" width="80" height="95" rx="4" fill="url(#bar-gradient)" filter="url(#bar-shadow)" />
      <!-- Valor acima da barra -->
      <text x="520" y="353" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">19</text>
      <!-- Rótulo do Eixo X -->
      <text x="520" y="492" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">11–15</text>
    </g>

    <!-- Barra 4: 16-19 (11%) -->
    <g>
      <!-- Altura: 11 * 5 = 55px. Y: 460 - 55 = 405px -->
      <rect x="624" y="405" width="80" height="55" rx="4" fill="url(#bar-gradient)" filter="url(#bar-shadow)" />
      <!-- Valor acima da barra -->
      <text x="664" y="393" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">11</text>
      <!-- Rótulo do Eixo X -->
      <text x="664" y="492" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">16–19</text>
    </g>

    <!-- Barra 5: 20+ (19%) -->
    <g>
      <!-- Altura: 19 * 5 = 95px. Y: 460 - 95 = 365px -->
      <rect x="768" y="365" width="80" height="95" rx="4" fill="url(#bar-gradient)" filter="url(#bar-shadow)" />
      <!-- Valor acima da barra -->
      <text x="808" y="353" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">19</text>
      <!-- Rótulo do Eixo X -->
      <text x="808" y="492" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">20+</text>
    </g>

    <!-- Título do Eixo X -->
    <text x="515" y="535" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.01em">Annual category purchase frequency (number of times)</text>

  </g>
</svg>

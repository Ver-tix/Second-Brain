<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title -->
  <text x="50" y="65" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">
    TABELA 6.2 Duplicação da compra
  </text>

  <!-- ================= HEADER SECTION ================= -->
  <!-- Left Header: Compradores da marca (Spans 2 rows) -->
  <rect x="50" y="100" width="240" height="100" fill="#475569" stroke="#ffffff" stroke-width="2" rx="4" />
  <text x="170" y="148" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Compradores</text>
  <text x="170" y="168" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">da marca</text>

  <!-- Top Right Header: Compradores que também compraram a marca -->
  <rect x="290" y="100" width="560" height="50" fill="#64748b" stroke="#ffffff" stroke-width="2" rx="4" />
  <text x="570" y="131" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Compradores que também compraram a marca</text>

  <!-- Sub-headers: A, B, C, D -->
  <rect x="290" y="150" width="140" height="50" fill="#94a3b8" stroke="#ffffff" stroke-width="2" rx="2" />
  <text x="360" y="181" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>

  <rect x="430" y="150" width="140" height="50" fill="#94a3b8" stroke="#ffffff" stroke-width="2" rx="2" />
  <text x="500" y="181" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>

  <rect x="570" y="150" width="140" height="50" fill="#94a3b8" stroke="#ffffff" stroke-width="2" rx="2" />
  <text x="640" y="181" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>

  <rect x="710" y="150" width="140" height="50" fill="#94a3b8" stroke="#ffffff" stroke-width="2" rx="2" />
  <text x="780" y="181" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>

  <!-- ================= DATA ROWS ================= -->
  <!-- Row 1 (A) -->
  <rect x="50" y="200" width="240" height="55" fill="#334155" stroke="#ffffff" stroke-width="2" rx="2" />
  <text x="170" y="233" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  
  <rect x="290" y="200" width="140" height="55" fill="#f8fafc" stroke="#ffffff" stroke-width="2" />
  <text x="360" y="233" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">100%</text>
  
  <rect x="430" y="200" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />
  <rect x="570" y="200" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />
  <rect x="710" y="200" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />

  <!-- Row 2 (B) -->
  <rect x="50" y="255" width="240" height="55" fill="#334155" stroke="#ffffff" stroke-width="2" rx="2" />
  <text x="170" y="288" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  
  <rect x="290" y="255" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />
  
  <rect x="430" y="255" width="140" height="55" fill="#f8fafc" stroke="#ffffff" stroke-width="2" />
  <text x="500" y="288" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">100%</text>
  
  <rect x="570" y="255" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />
  <rect x="710" y="255" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />

  <!-- Row 3 (C) -->
  <rect x="50" y="310" width="240" height="55" fill="#334155" stroke="#ffffff" stroke-width="2" rx="2" />
  <text x="170" y="343" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  
  <rect x="290" y="310" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />
  <rect x="430" y="310" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />
  
  <rect x="570" y="310" width="140" height="55" fill="#f8fafc" stroke="#ffffff" stroke-width="2" />
  <text x="640" y="343" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">100%</text>
  
  <rect x="710" y="310" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />

  <!-- Row 4 (D) -->
  <rect x="50" y="365" width="240" height="55" fill="#334155" stroke="#ffffff" stroke-width="2" rx="2" />
  <text x="170" y="398" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  
  <rect x="290" y="365" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />
  <rect x="430" y="365" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />
  <rect x="570" y="365" width="140" height="55" fill="#cbd5e1" fill-opacity="0.3" stroke="#ffffff" stroke-width="2" />
  
  <rect x="710" y="365" width="140" height="55" fill="#f8fafc" stroke="#ffffff" stroke-width="2" />
  <text x="780" y="398" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">100%</text>
</svg>

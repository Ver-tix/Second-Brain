<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%" style="background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="table-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Container da Tabela -->
  <rect x="30" y="30" width="940" height="490" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#table-shadow)" />

  <!-- Título -->
  <text x="50" y="70" font-size="18" font-weight="800" fill="#0f172a">Table 3.4: Mean average deviation variations (in percentage points) in telecommunication services' customer profiles (2014)</text>

  <!-- Cabeçalho -->
  <rect x="40" y="100" width="920" height="60" fill="#475569" rx="6" />
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="120" y="135">Country</text>
    <text x="280" y="135">Gender</text>
    <text x="400" y="135">Age</text>
    <text x="560" y="135">Household size (people)</text>
    <text x="730" y="135">Age of children</text>
    <text x="880" y="135">Income</text>
  </g>

  <!-- Dados da Tabela -->
  <g font-size="14" fill="#334155" text-anchor="middle">
    <text x="120" y="200">Brazil</text>      <text x="280" y="200">2</text> <text x="400" y="200">4</text> <text x="560" y="200">2</text> <text x="730" y="200">5</text> <text x="880" y="200">3</text>
    <text x="120" y="240">India</text>       <text x="280" y="240">4</text> <text x="400" y="240">3</text> <text x="560" y="240">1</text> <text x="730" y="240">3</text> <text x="880" y="240">2</text>
    <text x="120" y="280">Indonesia</text>   <text x="280" y="280">2</text> <text x="400" y="280">5</text> <text x="560" y="280">4</text> <text x="730" y="280">3</text> <text x="880" y="280">3</text>
    <text x="120" y="320">Mexico</text>     <text x="280" y="320">5</text> <text x="400" y="320">4</text> <text x="560" y="320">3</text> <text x="730" y="320">5</text> <text x="880" y="320">4</text>
    <text x="120" y="360">Nigeria</text>    <text x="280" y="360">6</text> <text x="400" y="360">4</text> <text x="560" y="360">3</text> <text x="730" y="360">5</text> <text x="880" y="360">4</text>
    <text x="120" y="400">Russia</text>     <text x="280" y="400">4</text> <text x="400" y="400">2</text> <text x="560" y="400">3</text> <text x="730" y="400">3</text> <text x="880" y="400">3</text>
    <text x="120" y="440">South Africa</text><text x="280" y="440">2</text> <text x="400" y="440">1</text> <text x="560" y="440">1</text> <text x="730" y="440">2</text> <text x="880" y="440">2</text>
    <text x="120" y="480">Turkey</text>      <text x="280" y="480">1</text> <text x="400" y="480">2</text> <text x="560" y="480">1</text> <text x="730" y="480">2</text> <text x="880" y="480">2</text>
  </g>

  <!-- Linha de Média -->
  <rect x="40" y="500" width="920" height="40" fill="#e2e8f0" rx="4" />
  <g font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="120" y="525">Category average</text>
    <text x="280" y="525">3</text> <text x="400" y="525">3</text> <text x="560" y="525">2</text> <text x="730" y="525">3</text> <text x="880" y="525">3</text>
  </g>
</svg>

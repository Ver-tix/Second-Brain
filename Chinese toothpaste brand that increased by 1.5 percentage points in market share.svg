<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Premium drop shadow for the container card -->
    <filter id="table-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="30" y="30" width="940" height="460" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#table-shadow)" />

  <!-- Table Title -->
  <g transform="translate(60, 75)">
    <text x="0" y="0" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">Table 2.1: Chinese toothpaste brand that increased by 1.5 percentage points in market share</text>
  </g>

  <!-- ================= TABLE STRUCTURE ================= -->
  <g transform="translate(0, 0)">
    
    <!-- Header Row Background (Rounded Top Corners) -->
    <path d="M 60,165 v -47 a 8,8 0 0 1 8,-8 h 864 a 8,8 0 0 1 8,8 v 47 Z" fill="#475569" />

    <!-- Alternating Row Backgrounds -->
    <rect x="60" y="165" width="880" height="40" fill="#f8fafc" />
    <rect x="60" y="205" width="880" height="40" fill="#ffffff" />
    <rect x="60" y="245" width="880" height="40" fill="#f8fafc" />
    <rect x="60" y="285" width="880" height="40" fill="#ffffff" />
    <rect x="60" y="325" width="880" height="40" fill="#f8fafc" />
    
    <!-- Bottom Row Background (Rounded Bottom Corners) -->
    <path d="M 60,365 h 880 v 32 a 8,8 0 0 1 -8,8 h -864 a 8,8 0 0 1 -8,-8 Z" fill="#ffffff" />

    <!-- Vertical Column Dividers -->
    <line x1="380" y1="110" x2="380" y2="405" stroke="#cbd5e1" stroke-width="1" />
    <line x1="560" y1="110" x2="560" y2="405" stroke="#cbd5e1" stroke-width="1" />
    <line x1="740" y1="110" x2="740" y2="405" stroke="#cbd5e1" stroke-width="1" />

    <!-- Horizontal Row Dividers -->
    <line x1="60" y1="165" x2="940" y2="165" stroke="#334155" stroke-width="2" />
    <line x1="60" y1="205" x2="940" y2="205" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="245" x2="940" y2="245" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="285" x2="940" y2="285" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="325" x2="940" y2="325" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="365" x2="940" y2="365" stroke="#e2e8f0" stroke-width="1" />
    <line x1="60" y1="405" x2="940" y2="405" stroke="#cbd5e1" stroke-width="1.5" />


    <!-- ================= TEXT & DATA CONTENT ================= -->

    <!-- COLUMN HEADERS (White Text) -->
    <g font-size="14" font-weight="700" fill="#ffffff">
      <!-- Col 1: Brand buying frequency -->
      <text x="85" y="143">Brand buying frequency</text>

      <!-- Col 2: Year 1 (%) -->
      <text x="470" y="143" text-anchor="middle">Year 1 (%)</text>

      <!-- Col 3: Year 2 (%) -->
      <text x="650" y="143" text-anchor="middle">Year 2 (%)</text>

      <!-- Col 4: Change (Y2 – Y1) -->
      <text x="840" y="143" text-anchor="middle">Change (Y2 – Y1)</text>
    </g>


    <!-- ROW 1: Zero -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="190">Zero</text>
      <text x="470" y="190" text-anchor="middle" font-weight="500">91.7</text>
      <text x="650" y="190" text-anchor="middle" font-weight="500">89.8</text>
      <text x="840" y="190" text-anchor="middle" font-weight="500" fill="#ef4444">- 1.9</text>
    </g>

    <!-- ROW 2: Once -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="230">Once</text>
      <text x="470" y="230" text-anchor="middle" font-weight="500">5.0</text>
      <text x="650" y="230" text-anchor="middle" font-weight="500">6.3</text>
      <text x="840" y="230" text-anchor="middle" font-weight="500" fill="#10b981">1.3</text>
    </g>

    <!-- ROW 3: Twice -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="270">Twice</text>
      <text x="470" y="270" text-anchor="middle" font-weight="500">1.6</text>
      <text x="650" y="270" text-anchor="middle" font-weight="500">2.0</text>
      <text x="840" y="270" text-anchor="middle" font-weight="500" fill="#10b981">0.4</text>
    </g>

    <!-- ROW 4: Three times -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="310">Three times</text>
      <text x="470" y="310" text-anchor="middle" font-weight="500">0.7</text>
      <text x="650" y="310" text-anchor="middle" font-weight="500">0.8</text>
      <text x="840" y="310" text-anchor="middle" font-weight="500" fill="#10b981">0.2</text>
    </g>

    <!-- ROW 5: Four times -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="350">Four times</text>
      <text x="470" y="350" text-anchor="middle" font-weight="500">0.6</text>
      <text x="650" y="350" text-anchor="middle" font-weight="500">0.5</text>
      <text x="840" y="350" text-anchor="middle" font-weight="500" fill="#ef4444">- 0.1</text>
    </g>

    <!-- ROW 6: Five or more times -->
    <g fill="#334155" font-size="14" font-weight="600">
      <text x="85" y="390">Five or more times</text>
      <text x="470" y="390" text-anchor="middle" font-weight="500">0.5</text>
      <text x="650" y="390" text-anchor="middle" font-weight="500">0.5</text>
      <text x="840" y="390" text-anchor="middle" font-weight="500">0</text>
    </g>

  </g>
</svg>
